name: Build DSAPI API documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Generate DocFX HTML
    runs-on: windows-latest
    steps:
      - name: Check out public DSAPI source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore DSAPI project
        run: dotnet restore src/RKM.DataStage.DSAPI/RKM.DataStage.DSAPI.csproj

      - name: Build documented .NET assembly
        run: dotnet build src/RKM.DataStage.DSAPI/RKM.DataStage.DSAPI.csproj --configuration Release --framework net10.0-windows --no-restore

      - name: Restore pinned DocFX tool
        run: dotnet tool restore

      - name: Generate DocFX HTML
        run: dotnet tool run docfx -- docs/docfx.json

      - name: Verify generated HTML
        shell: pwsh
        run: |
          if (-not (Test-Path 'docs/_site/index.html')) { throw 'DocFX index.html was not generated' }
          if (-not (Test-Path 'docs/_site/api')) { throw 'DocFX API output was not generated' }
          $apiPages = @(Get-ChildItem 'docs/_site/api' -Filter '*.html' -File -Recurse)
          if ($apiPages.Count -eq 0) { throw 'No API HTML pages were generated' }
          if (-not ($apiPages | Where-Object { $_.Name -like '*DSAPI*' })) {
            throw 'Expected a DSAPI API documentation page'
          }
          Write-Host "Generated $($apiPages.Count) API HTML pages"

      - name: Retain website preview as a ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsapi-html-reference
          path: docs/_site/
          if-no-files-found: error
          retention-days: 30
